# Credentials of the TREX-DM slow control.
#
# Copy this file to config/credentials.toml (not tracked by git) and fill it in. It is
# read from the working directory (run the commands from the repository root). Every
# section is optional: remove it (or leave it empty) to disable that feature.

# Alerts to a Slack channel (log records of level ERROR and above by default; the
# level can be changed from the HV subsystem's Config > Verbose menu)
[slack]
webhook_url = "https://hooks.slack.com/services/..."

# Alerts to a Mattermost channel (INFO and above by default)
[mattermost]
webhook_url = "https://mattermost.example.com/hooks/..."

# Emails with the CRITICAL log records (the flammable gas safety alarms).
# Use a dedicated Gmail account: turn on its 2-Step Verification and create an App
# Password (Google Account > Security > App passwords). The normal account password
# does not work.
[email]
smtp_server = "smtp.gmail.com"
smtp_port = 587
sender = "your.account@gmail.com"
app_password = "xxxx xxxx xxxx xxxx"
recipients = ["someone@example.com"]
# minimum seconds between emails: the records arriving in between are sent together
min_interval = 60

# Google Sheet run list (DAQ metrics frame of the HV subsystem)
[google_sheet]
# JSON key of the Google service account, which must have access to the sheet
credentials_file = "trex-slowcontrolHV-credentials.json"
sheet_name = "TREX-DM run lists"
worksheet_number = 6  # starts from 0

# SSH access to the DAQ PC, to read the DAQ metrics (the host is in
# config/devices_config.toml, [daq_metrics])
[daq_ssh]
username = "usertrex"
key_filename = "/home/usertrex/.ssh/id_rsa"
